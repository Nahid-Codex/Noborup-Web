<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="fanBg" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="rgbRing" x1="250" y1="220" x2="550" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#FF8618"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#fanBg)"/>
  <circle cx="400" cy="300" r="240" fill="#38BDF8" fill-opacity="0.1"/>
  <!-- Suspension Headband Arch -->
  <path d="M260 320 C260 130, 540 130, 540 320" stroke="#F8FAFC" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M280 310 C280 165, 520 165, 520 310" stroke="#94A3B8" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- Left Earcup -->
  <rect x="220" y="260" width="76" height="145" rx="38" fill="#F1F5F9" stroke="url(#rgbRing)" stroke-width="6"/>
  <circle cx="258" cy="332" r="22" fill="#0F172A" stroke="#38BDF8" stroke-width="4"/>
  <!-- Right Earcup -->
  <rect x="504" y="260" width="76" height="145" rx="38" fill="#F1F5F9" stroke="url(#rgbRing)" stroke-width="6"/>
  <circle cx="542" cy="332" r="22" fill="#0F172A" stroke="#A855F7" stroke-width="4"/>
  <!-- Boom Mic -->
  <path d="M245 390 Q290 455 375 440" stroke="#E2E8F0" stroke-width="8" stroke-linecap="round" fill="none"/>
  <rect x="368" y="430" width="26" height="16" rx="8" fill="#FF8618"/>
  <text x="400" y="515" text-anchor="middle" fill="#F8FAFC" font-family="sans-serif" font-size="18" font-weight="700" letter-spacing="2">FANTECH HG20 CHIEF II RGB</text>
  <text x="400" y="545" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="600" letter-spacing="3">50MM PRO GAMING HEADSET &amp; AUDIO</text>
