  <text x="474" y="300" text-anchor="middle" fill="#FDE047" font-family="sans-serif" font-size="12" font-weight="600">SNAPDRAGON 4 GEN 2</text>
  <text x="400" y="555" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="14" font-weight="600" letter-spacing="3">XIAOMI POCO · CERTIFIED PRE-OWNED</text>
