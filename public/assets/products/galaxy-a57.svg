<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="260" y1="60" x2="540" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="50%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="300" y1="80" x2="520" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="400" cy="300" r="250" fill="#38BDF8" fill-opacity="0.1"/>
  <!-- Back View Phone (Left) -->
  <rect x="230" y="85" width="200" height="430" rx="30" fill="url(#bodyGrad)" stroke="#E0F2FE" stroke-width="3"/>
  <!-- Samsung Vertical Triple Camera Rings -->
  <circle cx="272" cy="135" r="20" fill="#0F172A" stroke="#E0F2FE" stroke-width="4"/>
  <circle cx="272" cy="135" r="8" fill="#1E293B"/>
  <circle cx="272" cy="185" r="20" fill="#0F172A" stroke="#E0F2FE" stroke-width="4"/>
  <circle cx="272" cy="185" r="8" fill="#1E293B"/>
  <circle cx="272" cy="235" r="20" fill="#0F172A" stroke="#E0F2FE" stroke-width="4"/>
  <circle cx="272" cy="235" r="8" fill="#1E293B"/>
  <circle cx="310" cy="160" r="6" fill="#FEF08A"/>
  <!-- Front View Phone (Right Overlapping) -->
  <rect x="370" y="65" width="205" height="445" rx="30" fill="#0F172A" stroke="#64748B" stroke-width="4"/>
  <rect x="380" y="75" width="185" height="425" rx="24" fill="url(#screenGrad)"/>
  <circle cx="472" cy="92" r="5" fill="#090D16"/>
  <circle cx="472" cy="260" r="55" fill="#38BDF8" fill-opacity="0.2"/>
  <text x="472" y="265" text-anchor="middle" fill="#F8FAFC" font-family="sans-serif" font-size="22" font-weight="700">5G</text>
  <text x="400" y="555" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="14" font-weight="600" letter-spacing="3">SAMSUNG GALAXY A57 5G · 120HZ AMOLED</text>
</svg>
